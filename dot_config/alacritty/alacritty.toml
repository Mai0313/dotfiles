#:schema https://raw.githubusercontent.com/distinction-dev/alacritty-schema/main/alacritty/reference.json
# Alacritty configuration - most values below are Alacritty defaults, spelled
# out as a starting template. Colors come from the imported theme instead.
# Reference: https://alacritty.org/config-alacritty.html

[general]
# Themes are cloned by chezmoi (.chezmoiexternal.toml.tmpl).
# Swap the filename for any other theme in ~/.config/alacritty/themes/themes/.
import = ["~/.config/alacritty/themes/themes/nvim_dark.toml"]
live_config_reload = true
ipc_socket = true
working_directory = "None"

[window]
dynamic_padding = true
decorations = "Full"
opacity = 0.9
blur = true
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
resize_increments = true
decorations_theme_variant = "None"
option_as_alt = "None"

[window.dimensions]
columns = 110
lines = 30

# Default is unset (window manager decides). Uncomment to pin a position.
[window.position]
x = 1200
y = 600

[window.padding]
x = 0
y = 0

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 16
builtin_box_drawing = true

[font.normal]
family = "MesloLGS NF"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# Palettes live in the imported theme; only the non-color switches stay here.
[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = true

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"
command = "None"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = false

[cursor]
vi_mode_style = "None"
blink_interval = 750
blink_timeout = 5
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "Off"

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = false

[hints]
alphabet = "jfkdls;ahgurieowpq"

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
