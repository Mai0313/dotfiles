# Key naming, both halves of it. A bare name is installed everywhere, `work_`
# only when is_work, `home_` only when not; every environment is therefore the
# bare list plus its own additions, and no list is ever subtractive. The name
# also picks the installer, which is why darwin and work_darwin cannot merge:
# darwin is brew, work_darwin is `sudo mule install`, linux and work_linux are
# apt, windows is winget but work_windows is googet, npm and home_npm are
# `npm install -g`.
packages:
  darwin:
    - zsh
    - vim
    - wget
    - git
    - curl
    - neovim
    - ripgrep
    - fd
    - fastfetch
    - gh
    - gdu
  linux:
    - zsh
    - vim
    - wget
    - fontconfig
    - git
    - curl
    - ripgrep
    - fd-find
    - fuse-overlayfs
    - tmux
    - python-is-python3
  # winget packages, installed by run_onchange_after_setup.ps1.tmpl. Each entry
  # is whatever that project's own docs tell you to type, which is why some are
  # bare names and gh is an identifier. The script passes them through unchanged
  # and winget matches a name, moniker or id alike. A bare name that ever goes
  # ambiguous fails the install; the fix is to swap in its PackageIdentifier.
  #
  # Google.PlatformTools is a portable (zip) package whose binaries need the
  # AdbWinApi DLLs beside them, so winget appends the extracted directory to the
  # user PATH instead of shimming adb.exe into WinGet\Links the way it does for
  # the others. That entry is what puts adb and fastboot on PATH, which is why
  # the Windows profile has no adb path of its own -- but it lands at the end of
  # the user PATH and only a new shell sees it.
  #
  # CoreyButler.NVMforWindows is what the *nix side gets from the .nvm external,
  # which cannot serve Windows: nvm-windows is an inno installer that writes
  # environment variables, not a git clone. The node section of setup-body.ps1
  # depends on it, so this whole list installs before that section runs.
  windows:
    - fastfetch
    - GitHub.cli
    - gdu
    - Google.PlatformTools
    - Notepad++.Notepad++
    - CoreyButler.NVMforWindows
    - Git.Git
    - Gyan.FFmpeg
  # Corp-only macOS packages distributed via Mule (go/mule).
  work_darwin:
    # Cloudtop CLI & Screenshot
    - ct-cli
    - snipit
    # Android & Pixel firmware work
    - adb
    - web-device-proxy
    # google3 / Cider / VCS
    - cidermux
    - fig
    - srcfs
    - git
    # Remote access & Networking
    - roadwarrior
    - gnubby-cli
    # AI & Developer tools
    - gemini-cli
    - jetski-cli
    # Terminal & Utilities
    - tmux
    # GUI Applications (installed via Mule)
    - google-chrome
    - google-crd
    - googledrive
    - visual-studio-code
    - jetski
    - iterm2
  # Apt packages for corp Linux, all reachable from the repos a gLinux machine
  # has by default. Mostly corp-only tooling, but it also carries anything the
  # gLinux repos have and noble does not, which is why fastfetch sits here and
  # not under `linux`. Deliberately absent: bugged and vscode-google3, which
  # install_vscode_for_google3.sh installs in section 2. bugged needs
  # `glinux-add-repo bugged stable` first, so listing it here would fail the
  # whole script on a fresh machine.
  work_linux:
    # google3 / Cider
    - cogfsd
    - cidermux
    # Cloudtop CLI
    - ct-cli
    # Android and Pixel firmware work
    - adb
    - repo
    # Pontis USB device bridging, see go/pontis/userguide. usbip covers the
    # devices Pontis cannot bridge as plain adb/fastboot.
    - pontisd
    - usbip
    # Serial console for firmware debugging
    - minicom
    - picocom
    - python3-serial
    - python3-usb
    # sshfs backs the ~/linux_kernel mount driven by .local/bin/linux-kernel-mount
    - sshfs
    - roadwarrior
    # Git-on-Borg client tools. Unlike glaze, glint, gpylint, pyformat,
    # google-clang-tools and google-f1-sql, which gLinux provisioning names on
    # its own apt command line and which therefore need no entry here, nothing
    # installs this one for you. The package ships no binary of its own name: it
    # provides git-remote-rpc, git-remote-submodule-pilot and gob-ctl.
    - git-remote-google
    # Not corp-specific, just absent from noble. Installing it here in §1 makes
    # the §11 tarball fall through on corp machines.
    - fastfetch
  # Corp Windows packages, installed with googet (go/googet), the gWindows
  # channel for corp software, not winget. The install needs an elevated shell
  # and does not touch PATH: jetski-cli lands in C:\Program Files\Google\
  # jetski-cli, which the machine still has to put on PATH itself.
  work_windows:
    - jetski-cli
  # Global npm CLIs, installed after nvm sets up node LTS. Skipped on work macOS.
  # npm and corepack ship with node, so they are intentionally excluded.
  npm:
    - "npm@latest"
    - "@anthropic-ai/claude-code"
    - "@google/gemini-cli"
    - "@mai0313/vct"
    - "@deepseek-ai/dsh"
    - "@earendil-works/pi-coding-agent"
    - "tree-sitter-cli"
  # Installed on top of npm, on home machines only: these do not install on a
  # corp machine, so a work run must not carry them.
  home_npm:
    - "@openai/codex"
    - "opencode-ai"
    - "reasonix"
    - "@charmland/crush"
