packages:
  darwin:
    - zsh
    - vim
    - wget
    - git
    - curl
    - neovim
    - ripgrep
    - fd
    - lazygit
  linux:
    - zsh
    - vim
    - wget
    - fontconfig
    - git
    - curl
    - ripgrep
    - fd-find
    - fuse-overlayfs
    - tmux
    - htop
    - gh
  # Corp-only macOS packages distributed via Mule (go/mule).
  work_darwin:
    - ct-cli
  # Corp-only apt packages, all reachable from the repos a gLinux machine has by
  # default. Deliberately absent: bugged and vscode-google3, which
  # install_vscode_for_google3.sh installs in section 1. bugged needs
  # `glinux-add-repo bugged stable` first, so listing it here would fail the
  # whole script on a fresh machine.
  work_linux:
    # google3 / Cider
    - cogfsd
    - cidermux
    # Cloudtop CLI
    - ct-cli
    # Android and Pixel firmware work
    - adb
    - repo
    # Pontis USB device bridging, see go/pontis/userguide. usbip covers the
    # devices Pontis cannot bridge as plain adb/fastboot.
    - pontisd
    - usbip
    # Serial console for firmware debugging
    - minicom
    - picocom
    - python3-serial
    - python3-usb
    # sshfs backs the ~/linux_kernel mount driven by .local/bin/linux-kernel-mount
    - sshfs
    - roadwarrior
    - jetski-memory
  # Linux input method (Chinese). The four frontends cover both toolkits and both
  # Qt majors; kimpanel is what puts the fcitx5 status back into the GNOME top
  # bar, since GNOME's own keyboard settings only ever list ibus engines.
  im_linux:
    - fcitx5
    - fcitx5-chewing
    - fcitx5-config-qt
    - fcitx5-frontend-gtk3
    - fcitx5-frontend-gtk4
    - fcitx5-frontend-qt5
    - fcitx5-frontend-qt6
    - gnome-shell-extension-kimpanel
  # Global npm CLIs, installed after nvm sets up node LTS. Skipped on work macOS.
  # npm and corepack ship with node, so they are intentionally excluded.
  npm_global:
    - "@anthropic-ai/claude-code"
    - "@charmland/crush"
    - "@google/gemini-cli"
    - "@mai0313/vct"
    - "@openai/codex"
    - opencode-ai
    - reasonix
    - tree-sitter-cli
