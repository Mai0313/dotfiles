#:schema https://developers.openai.com/codex/config-schema.json
# Example: https://developers.openai.com/codex/config-sample
# Profile Example: https://developers.openai.com/codex/config-advanced#profiles

model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
personality = "pragmatic"
approval_policy = "never"
model_reasoning_effort = "ultra"
plan_mode_reasoning_effort = "ultra"
model_reasoning_summary = "auto"
model_context_window = 1050000
model_auto_compact_token_limit = 735000
model_verbosity = "medium"

model_provider = "oai"

# Use default memory models.
# [memories]
# extract_model = "gpt-5.6-luna"
# consolidation_model = "gpt-5.6-terra"

# GPT-5.6 collaboration reserved namespace issues:
# https://github.com/openai/codex/issues/31864
# https://github.com/openai/codex/issues/31875
# Update on 2026-07-13: This issue might be resolved by Azure; so disable it for now.
