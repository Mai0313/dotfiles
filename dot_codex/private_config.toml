#:schema https://developers.openai.com/codex/config-schema.json
# For checking git-diff, see: https://github.com/openai/codex/blob/main/codex-rs/core/config.schema.json
# Example: https://developers.openai.com/codex/config-sample

model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
personality = "pragmatic"
approval_policy = "never"
model_reasoning_effort = "ultra"
plan_mode_reasoning_effort = "ultra"
model_reasoning_summary = "auto"
model_context_window = 1050000
model_auto_compact_token_limit = 945000
model_auto_compact_token_limit_scope = "total"
model_verbosity = "medium"

# # Disable it to use ChatGPT subscription.
# model_provider = "oai"

# model_supports_reasoning_summaries = true
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "GEMINI.md", "copilot-instructions.md"]
project_doc_max_bytes = 32768
web_search = "live"
suppress_unstable_features_warning = true

approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
hide_agent_reasoning = false
show_raw_agent_reasoning = false
disable_paste_burst = false
check_for_update_on_startup = true

[model_providers.oai]
name = "oai"
base_url = "https://api.mai0313.com"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
http_headers = { "x-litellm-end-user-id" = "codex" }

[features]
shell_tool = true
apps = true
hooks = true
shell_snapshot = true
multi_agent = true
personality = true
enable_request_compression = true
skill_mcp_dependency_install = true
js_repl = true
memories = true
prevent_idle_sleep = true
goals = true
mentions_v2 = true
multi_agent_v2 = true
unified_exec = true
remote_plugin = true
fast_mode = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

[analytics]
enabled = false

[feedback]
enabled = false

[agents]
enabled = true
max_concurrent_threads_per_session = 10
max_depth = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
alternate_screen = "always"
status_line = ["current-dir", "model-with-reasoning", "git-branch", "pull-request-number", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[desktop]
show-context-window-usage = true
followUpQueueMode = "steer"
hotkey-window-projectless-default-enabled = true
git-show-sidebar-pr-icons = true
git-pull-request-merge-method = "squash"
selected-avatar-id = "custom:ikun"
conversationDetailMode = "STEPS_COMMANDS"
localeOverride = "zh-TW"
defaultTerminalLocation = "bottom"
reduced-motion-preference = "system"
sansFontSize = 16
codeFontSize = 14
appearanceDiffMarkerStyle = "color"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
show-ultra-in-model-picker-slider = true
open-local-url-in-target-preference = "external-browser"
reviewDelivery = "detached"

[windows]
sandbox = "elevated"

[notice]
hide_rate_limit_model_nudge = true
