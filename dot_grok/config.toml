[cli]
installer = "internal"

[model.grok]
model = "grok-4.5"
base_url = "https://api.mai0313.com"
name = "Grok 4.5 (Mai0313)"
description = "From api.mai0313.com"
env_key = "OPENAI_API_KEY"
api_backend = "responses"
temperature = 0.7
top_p = 0.95
max_completion_tokens = 8192
context_window = 1000000
supports_backend_search = true

