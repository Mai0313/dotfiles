# Environment: https://docs.x.ai/build/settings/reference#environment-variables
# Values: https://docs.x.ai/build/settings/reference#toml-values
# Example: https://docs.x.ai/build/settings#example-configtoml

[cli]
installer = "internal"

[models]
default_reasoning_effort = "high"

[model.grok]
model = "grok-4.5"
base_url = "https://api.mai0313.com"
name = "Grok 4.5 (Mai0313)"
description = "From api.mai0313.com"
env_key = "OPENAI_API_KEY"
api_backend = "responses"
temperature = 0.7
top_p = 0.95
max_completion_tokens = 8192
context_window = 1000000
supports_backend_search = true
supports_reasoning_effort = true

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[session]
auto_compact_threshold_percent = 85

[ui]
max_thoughts_width = 120
yolo = true
compact_mode = true
permission_mode = "always-approve"
auto_interject_on_task_wait = true
