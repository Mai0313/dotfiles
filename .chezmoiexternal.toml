# nvm's own installer is a git clone plus a tag checkout, so an external does
# the same work with no version lookup against api.github.com. Deliberately a
# release tag and not the default branch: nvm.sh is sourced into every shell,
# and nvm cuts a release every few months, so tracking its development branch
# buys nothing and risks all of them. Bumping the version below is the whole
# maintenance, and an existing ~/.nvm sitting on an older tag fast-forwards
# onto the new one by itself.
#
# A tag means a detached HEAD, where a bare `git pull` refuses and fails the
# apply, hence naming the remote and ref explicitly. Installed node versions
# and the default alias live under paths nvm gitignores (`v*`, `alias`), so
# neither the clone nor the pull touches them. Windows is excluded because
# setup-body.ps1 assumes node is already there.
[".nvm"]
    type = "git-repo"
    url = "https://github.com/nvm-sh/nvm"
    refreshPeriod = "168h"
    [".nvm".clone]
        args = ["--branch", "v0.40.7"]
    [".nvm".pull]
        args = ["--ff-only", "origin", "v0.40.7"]
{{- end }}

{{ if eq .chezmoi.os "linux" -}}
# Linux only, and deliberately not apt packages: noble freezes at release, so it
# still offers gh 2.45 and gdu 5.25 against the versions below. brew and winget
# both track upstream within a day or two, so darwin and windows take these
# from packages.yaml instead.
#
# Both versions are pinned by hand, and bumping them is the whole maintenance.
# Do not resolve one through api.github.com, `gitHubLatestRelease` included:
# unauthenticated it is 60/hr per IP and a shared-egress runner (Claude Code
# Cloud) burns that long before chezmoi gets a turn, which failed the whole
# apply while reading this file, setup script and all.
[".local/bin/gh"]
    type = "archive-file"
    url = "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_{{ .chezmoi.arch }}.tar.gz"
    path = "gh_2.101.0_linux_{{ .chezmoi.arch }}/bin/gh"
    executable = true
    refreshPeriod = "168h"

[".local/bin/gdu"]
    type = "archive-file"
    url = "https://github.com/dundee/gdu/releases/download/v5.37.0/gdu_linux_{{ .chezmoi.arch }}.tgz"
    path = "gdu_linux_{{ .chezmoi.arch }}"
    executable = true
    refreshPeriod = "168h"

{{- end }}

{{ if .is_work -}}
["adb-keys/security"]
    type = "git-repo"
    url = "sso://googleplex-android/platform/vendor/google/security"
    refreshPeriod = "1h"
{{- end }}
