[".agents"]
    type = "git-repo"
    url = "https://github.com/Mai0313/skills"
    refreshPeriod = "1h"

[".gemini"]
    type = "git-repo"
    url = "https://github.com/Mai0313/.gemini"
    refreshPeriod = "1h"

{{ if ne .chezmoi.os "windows" -}}
[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh"
    refreshPeriod = "24h"
    [".oh-my-zsh".clone]
        args = ["--depth=1"]
    [".oh-my-zsh".pull]
        args = ["--ff-only"]

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k"
    refreshPeriod = "24h"
    [".oh-my-zsh/custom/themes/powerlevel10k".clone]
        args = ["--depth=1"]
    [".oh-my-zsh/custom/themes/powerlevel10k".pull]
        args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions"
    refreshPeriod = "24h"
    [".oh-my-zsh/custom/plugins/zsh-autosuggestions".clone]
        args = ["--depth=1"]
    [".oh-my-zsh/custom/plugins/zsh-autosuggestions".pull]
        args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting"
    refreshPeriod = "24h"
    [".oh-my-zsh/custom/plugins/zsh-syntax-highlighting".clone]
        args = ["--depth=1"]
    [".oh-my-zsh/custom/plugins/zsh-syntax-highlighting".pull]
        args = ["--ff-only"]
{{- end }}

{{ if eq .chezmoi.os "linux" -}}
# Deliberately not apt packages: noble ships both far behind upstream.
{{ $gh := (gitHubLatestRelease "cli/cli").TagName | trimPrefix "v" -}}
[".local/bin/gh"]
    type = "archive-file"
    url = "https://github.com/cli/cli/releases/download/v{{ $gh }}/gh_{{ $gh }}_linux_{{ .chezmoi.arch }}.tar.gz"
    path = "gh_{{ $gh }}_linux_{{ .chezmoi.arch }}/bin/gh"
    executable = true
    refreshPeriod = "168h"

[".local/bin/gdu"]
    type = "archive-file"
    url = "https://github.com/dundee/gdu/releases/latest/download/gdu_linux_{{ .chezmoi.arch }}.tgz"
    path = "gdu_linux_{{ .chezmoi.arch }}"
    executable = true
    refreshPeriod = "168h"

{{- end }}

{{ if .is_work -}}
["adb-keys/security"]
    type = "git-repo"
    url = "sso://googleplex-android/platform/vendor/google/security"
    refreshPeriod = "1h"
{{- end }}
